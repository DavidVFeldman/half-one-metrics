name: build
on:
  push: { branches: [main] }
  pull_request:
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults: { run: { working-directory: lean } }
    steps:
      - uses: actions/checkout@v4
      - name: install elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
      - name: mathlib cache
        run: lake exe cache get
      - name: build
        run: lake build
      - name: axiom audit
        run: |
          lake env lean HalfOne/AxiomCheck.lean > axioms.txt 2>&1
          cat axioms.txt
          if grep -q "sorryAx" axioms.txt; then
            echo "FAIL: sorryAx present"; exit 1
          fi
          BAD=$(sed -n "s/.*depends on axioms: \[\(.*\)\]/\1/p" axioms.txt \
            | tr ',' '\n' | tr -d ' ' | sort -u \
            | grep -vE '^(propext|Classical\.choice|Quot\.sound|Lean\.ofReduceBool|Lean\.trustCompiler)$' || true)
          if [ -n "$BAD" ]; then
            echo "FAIL: unexpected axioms:"; echo "$BAD"; exit 1
          fi
          STRAY=$(grep "Lean.ofReduceBool" axioms.txt | grep -vE "census6|census7" || true)
          if [ -n "$STRAY" ]; then
            echo "FAIL: compiler axiom outside census6/census7:"; echo "$STRAY"; exit 1
          fi
          echo "axiom audit clean"
